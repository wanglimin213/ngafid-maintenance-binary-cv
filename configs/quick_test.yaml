seed: 42

data:
  data_dir: data/2days
  max_length: 4096
  channels: 23
  label_column: before_after
  fold_column: fold
  scale_mode: paper_stats

model:
  name: inception_lite
  in_channels: 23
  filters: 16
  depth: 3
  kernel_size: 21
  bottleneck_channels: 16
  dropout: 0.0

training:
  device: auto
  folds: 5
  epochs: 1
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0000
  max_steps_per_epoch: 5
  num_workers: 0
  save_best: false
  early_stopping_patience: null

output:
  results_dir: results_quick
  checkpoint_dir: checkpoints_quick
