# Improved NGAFID maintenance binary detection baseline.
# Improvements over the previous baseline:
# 1) AdamW optimizer
# 2) weight decay
# 3) ReduceLROnPlateau scheduler
# 4) Early stopping
# 5) GlobalAvgPool + GlobalMaxPool pooling

seed: 42

data:
  data_dir: data/2days
  max_length: 4096
  channels: 23
  label_column: before_after
  fold_column: fold
  scale_mode: paper_stats

model:
  name: inception_lite
  in_channels: 23
  filters: 32
  depth: 6
  kernel_size: 41
  bottleneck_channels: 32
  dropout: 0.0
  pooling: avgmax

training:
  device: cuda
  folds: 5
  epochs: 150
  batch_size: 24
  learning_rate: 0.0001

  optimizer: adamw
  weight_decay: 0.0001

  scheduler: reduce_on_plateau
  scheduler_patience: 5
  scheduler_factor: 0.5
  min_lr: 0.000001

  early_stopping_patience: 15
  early_stopping_monitor: val_loss
  early_stopping_min_delta: 0.0001

  max_steps_per_epoch: 100
  num_workers: 0
  save_best: true

output:
  results_dir: results_improved
  checkpoint_dir: checkpoints_improved
