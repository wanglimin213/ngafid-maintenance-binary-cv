# NGAFID maintenance binary detection: before-maintenance vs after-maintenance
# This config follows the paper-style data setup: 2-day subset, last 4096 timesteps,
# 23 channels, 5 folds, MinMax statistics from the supplied stats.csv.

seed: 42

data:
  data_dir: data/2days
  max_length: 4096
  channels: 23
  label_column: before_after
  fold_column: fold
  scale_mode: paper_stats  # paper_stats uses stats.csv from the dataset

model:
  name: inception_lite
  in_channels: 23
  filters: 32
  depth: 6
  kernel_size: 41
  bottleneck_channels: 32
  dropout: 0.0

training:
  device: cuda
  folds: 5
  epochs: 100
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0000
  max_steps_per_epoch: 100   # set null to use the full training split each epoch
  num_workers: 0
  save_best: true
  early_stopping_patience: null

output:
  results_dir: results
  checkpoint_dir: checkpoints
